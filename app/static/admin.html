<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Administración</title>
<link rel="stylesheet" href="/static/legal.css">
<style>
 .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
 .k{border:1px solid #d9dde3;border-radius:10px;padding:12px}.k b{display:block;font-size:26px}
 table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #e3e6ea;padding:6px 8px;text-align:left}
 .mal{color:#b3261e;font-weight:600}.bien{color:#1e7a3c;font-weight:600}.n{color:#666;font-size:13px}
</style></head><body>
<main class="legal">
<h1>Administración</h1>
<p class="n">Solo números agregados: no se muestran correos ni ofertas de nadie. <a href="/">Volver</a></p>
<div class="g" id="kpi"></div>
<h2>Portales</h2>
<table><thead><tr><th>Portal</th><th>Estado</th><th>Ok</th><th>Fallas</th><th>Último ok</th><th>Último error</th></tr></thead><tbody id="por"></tbody></table>
<h2>Altas por día</h2><table><tbody id="altas"></tbody></table>
<h2>Servidor</h2><p id="srv" class="n"></p>
</main>
<script>
const f=t=>t?new Date(t*1000).toLocaleString("es-AR"):"—";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("/api/admin/stats").then(r=>r.json()).then(d=>{
 if(d.error){document.body.innerHTML="<p style='padding:30px'>"+esc(d.error)+"</p>";return}
 const c=d.cuentas,k=[["Cuentas",c.cuentas],["Verificadas",c.verificadas],["Activas (7 días)",c.activas_7d],["Con resumen diario",c.con_resumen_diario],
  ["Búsquedas en caché",d.cache.busquedas.archivos],["Detalles en caché",d.cache.detalles.archivos]];
 kpi.innerHTML=k.map(([a,b])=>`<div class="k"><b>${esc(b)}</b>${esc(a)}</div>`).join("");
 const ps=Object.entries(d.portales).sort((a,b)=>b[1].seguidas-a[1].seguidas);
 por.innerHTML=ps.length?ps.map(([n,p])=>`<tr><td>${esc(n)}</td><td class="${p.seguidas>=3?"mal":p.seguidas?"":"bien"}">${p.seguidas>=3?"CAÍDO ("+p.seguidas+" seguidas)":p.seguidas?"con fallas":"ok"}</td><td>${p.ok}</td><td>${p.fail}</td><td>${f(p.last_ok)}</td><td>${esc(p.last_note||"")}</td></tr>`).join(""):"<tr><td colspan=6>Todavía no hay consultas reales.</td></tr>";
 altas.innerHTML=c.altas_por_dia.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${b}</td></tr>`).join("")||"<tr><td>Sin altas</td></tr>";
 srv.textContent=`Modo público: ${d.publico?"sí":"no"} · Correo (Brevo): ${d.mail?"configurado":"NO configurado"} · Admins con alertas: ${d.admins} · Caché ${d.cache.ttl_min} min · ${d.cache.busquedas.kb+d.cache.detalles.kb} KB`;
});
</script></body></html>
